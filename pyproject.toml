[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-strategy-factory"
version = "0.1.0"
description = "自动化量化策略工厂:数据 → 洞察 → 策略生成 → AI 评估 → 回测 → 决策 → 复盘 的端到端流水线"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "markwave" }]
keywords = ["quant", "trading", "backtest", "llm", "strategy", "pipeline"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 富途 OpenD —— 统一数据底座(20年历史 + PE + 换手率,与执行场所同源)
opend = [
    "futu-api>=10.4",
]
# 其它真实数据源(可选)
data = [
    "akshare>=1.12",
    "yfinance>=0.2",
    "feedparser>=6.0",
]
# 真实 LLM 评审(先留着,mock 模式不需要安装)
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
qsf = "qsf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
